{% extends 'base.html' %}
{% load static %}

{% block title %}Manager Login{% endblock %}

{% block content %}

<style>
  .manager-login-card {
      max-width: 500px;
      margin: auto;
      margin-top: 5rem;
      background: white;
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  }
  .btn-manager {
      width: 100%;
      padding: 1rem;
      background: #d4af37;
      color: white;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      transition: 0.3s;
  }
  .btn-manager:hover {
      background: #b8941f;
  }
</style>

<div class="manager-login-card">
    <h2 class="text-center mb-4">Manager Login</h2>

    {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button class="btn-manager" type="submit">Login</button>
    </form>
</div>

{% endblock %}
