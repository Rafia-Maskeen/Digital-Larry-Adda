{% extends 'base.html' %}
{% load static %}
{% block title %}Find a Ride - Digital Larry Adda{% endblock %}

{% block content %}
<style>
  :root {
    --gold: #D4AF37;
    --gold-light: #E8C56A;
    --gold-dark: #B8941F;
    --cream: #FFFAF0;
    --charcoal: #2D2D2D;
    --soft-white: #FDFDFD;
    --shadow-soft: 0 15px 50px rgba(212, 175, 55, 0.18);
    --shadow-hover: 0 30px 90px rgba(212, 175, 55, 0.35);
  }

  .ride-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6rem 1.5rem;
    background: linear-gradient(135deg, #fffdf8 0%, var(--cream) 100%);
    position: relative;
    overflow: hidden;
  }

  .ride-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(circle at 15% 85%, rgba(212,175,55,0.15) 0%, transparent 50%),
      radial-gradient(circle at 85% 15%, rgba(212,175,55,0.1) 0%, transparent 50%);
    z-index: 0;
    animation: breathe 12s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* Floating Orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold));
    filter: blur(1.5px);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    animation: floatOrb 10s infinite ease-in-out;
  }

  @keyframes floatOrb {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50% { transform: translateY(-50px) scale(1.3); opacity: 0.6; }
  }

  .ride-card {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 32px;
    padding: 3.5rem;
    max-width: 560px;
    width: 100%;
    box-shadow: var(--shadow-soft), inset 0 0 40px rgba(212,175,55,0.1);
    border: 1.5px solid rgba(212,175,55,0.25);
    position: relative;
    z-index: 2;
    transition: all 0.6s ease;
  }

  .ride-card:hover {
    transform: translateY(-12px);
    box-shadow: var(--shadow-hover);
    border-color: var(--gold);
  }

  .ride-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3rem);
    text-align: center;
    margin-bottom: 2.5rem;
    color: var(--charcoal);
    position: relative;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .ride-card h2::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius: 2px;
    animation: underlineGrow 1.5s ease-out forwards;
  }

  @keyframes underlineGrow {
    from { width: 0; }
    to { width: 90px; }
  }

  .form-group {
    position: relative;
    margin-bottom: 1.8rem;
  }

  .form-label {
    position: absolute;
    top: 50%;
    left: 3rem;
    transform: translateY(-50%);
    font-size: 1rem;
    font-weight: 600;
    color: #666;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 1;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .form-control {
    width: 100%;
    padding: 1.1rem 1.2rem 1.1rem 3.5rem;
    font-size: 1rem;
    background: rgba(255, 255, 255, 0.75);
    border: 1.5px solid rgba(212,175,55,0.25);
    border-radius: 18px;
    transition: all 0.4s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    position: relative;
    z-index: 0;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--gold);
    background: white;
    box-shadow: 0 8px 30px rgba(212,175,55,0.25);
    transform: scale(1.02);
  }

  .form-control:focus + .form-label,
  .form-control:not(:placeholder-shown) + .form-label {
    top: -10px;
    left: 1.5rem;
    font-size: 0.8rem;
    color: var(--gold-dark);
    background: white;
    padding: 0 0.6rem;
    font-weight: 700;
  }

  .form-control::placeholder {
    color: transparent;
  }

  .input-icon {
    position: absolute;
    top: 50%;
    left: 1.2rem;
    transform: translateY(-50%);
    font-size: 1.3rem;
    color: var(--gold-dark);
    z-index: 2;
    pointer-events: none;
  }

  .pickup-icon { color: #28a745; }
  .drop-icon { color: #dc3545; }

  /* Route Preview */
  .route-preview {
    margin: 1.5rem 0;
    padding: 1rem;
    background: rgba(212,175,55,0.08);
    border-radius: 16px;
    text-align: center;
    font-size: 0.95rem;
    color: var(--charcoal);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .route-preview.show {
    opacity: 1;
  }

  .route-line {
    height: 3px;
    background: linear-gradient(90deg, #28a745, #dc3545);
    margin: 0.8rem auto;
    width: 60%;
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }

  .route-line::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: shimmer 1.5s infinite;
  }

  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  /* AI Suggestion Chips */
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-top: 1rem;
    justify-content: center;
  }

  .chip {
    background: rgba(212,175,55,0.15);
    color: var(--gold-dark);
    padding: 0.5rem 1rem;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid rgba(212,175,55,0.3);
  }

  .chip:hover {
    background: var(--gold);
    color: white;
    transform: translateY(-2px);
  }

  /* Submit Button */
  .btn-golden {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: white;
    border: none;
    padding: 1.2rem 2.5rem;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 50px;
    width: 100%;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    position: relative;
    overflow: hidden;
    z-index: 1;
    box-shadow: 0 10px 30px rgba(212,175,55,0.4);
    transition: all 0.5s ease;
    margin-top: 1.5rem;
  }

  .btn-golden::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
    z-index: -1;
  }

  .btn-golden:hover {
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 20px 50px rgba(212,175,55,0.5);
  }

  .btn-golden:active::before {
    width: 300px; height: 300px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .ride-card {
      padding: 2.5rem;
      border-radius: 24px;
    }
    .ride-card h2 {
      font-size: 2.2rem;
    }
    .input-icon {
      left: 1rem;
      font-size: 1.1rem;
    }
    .form-control {
      padding-left: 3rem;
    }
  }

  @media (max-width: 576px) {
    .ride-section {
      padding: 4rem 1rem;
    }
    .ride-card {
      padding: 2rem;
    }
    .form-control {
      padding: 1rem 1rem 1rem 2.8rem;
    }
    .btn-golden {
      padding: 1rem;
      font-size: 1rem;
    }
    .chip {
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
    }
  }
</style>

<section class="ride-section">
  <!-- Floating Orbs -->
  <div class="orb" style="width:90px;height:90px;top:10%;left:8%;animation-delay:0s;"></div>
  <div class="orb" style="width:70px;height:70px;top:75%;right:12%;animation-delay:2s;"></div>
  <div class="orb" style="width:110px;height:110px;bottom:15%;left:5%;animation-delay:4s;"></div>

  <div class="ride-card">
    <h2>Find Your Ride</h2>

    <form method="GET" action="{% url 'available_vehicles' %}" novalidate>
      <div class="form-group">
        <i class="fas fa-map-marker-alt input-icon pickup-icon"></i>
        <input type="text" class="form-control" id="pickup" name="pickup" placeholder=" " required>
        <label for="pickup" class="form-label">Current Location</label>
      </div>

      <div class="form-group">
        <i class="fas fa-flag-checkered input-icon drop-icon"></i>
        <input type="text" class="form-control" id="drop" name="dropoff" placeholder=" " required>
        <label for="drop" class="form-label">Destination</label>
      </div>

      <!-- Route Preview -->
      <div class="route-preview" id="routePreview">
        <div>Hostel <i class="fas fa-arrow-right"></i> Main Campus</div>
        <div class="route-line"></div>
        <div><strong>~12 min</strong> • 3.2 km</div>
      </div>

      <!-- AI Suggestions -->
      <div class="suggestions">
        <div class="chip" onclick="fillLocation('Hostel A')">Hostel A</div>
        <div class="chip" onclick="fillLocation('Main Gate')">Main Gate</div>
        <div class="chip" onclick="fillLocation('Library')">Library</div>
        <div class="chip" onclick="fillLocation('Cafeteria')">Cafeteria</div>
      </div>

      <button type="submit" class="btn-golden">Show Shuttles</button>
    </form>
  </div>
</section>

<script>
  // Fill location on chip click
  function fillLocation(location) {
    const pickup = document.getElementById('pickup');
    const drop = document.getElementById('drop');
    if (!pickup.value) {
      pickup.value = location;
      pickup.dispatchEvent(new Event('input'));
    } else if (!drop.value) {
      drop.value = location;
      drop.dispatchEvent(new Event('input'));
    }
    updatePreview();
  }

  // Update route preview
  function updatePreview() {
    const pickup = document.getElementById('pickup').value;
    const drop = document.getElementById('drop').value;
    const preview = document.getElementById('routePreview');
    
    if (pickup && drop) {
      preview.innerHTML = `
        <div>${pickup} <i class="fas fa-arrow-right"></i> ${drop}</div>
        <div class="route-line"></div>
        <div><strong>~10-15 min</strong> • Est. distance</div>
      `;
      preview.classList.add('show');
    } else {
      preview.classList.remove('show');
    }
  }

  // Listen to input
  document.getElementById('pickup').addEventListener('input', updatePreview);
  document.getElementById('drop').addEventListener('input', updatePreview);

  // Golden confetti on form submit
  document.querySelector('form').addEventListener('submit', function(e) {
    setTimeout(() => {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#D4AF37', '#E8C56A', '#B8941F']
      });
    }, 300);
  });
</script>

<!-- Font Awesome -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
{% endblock %}
